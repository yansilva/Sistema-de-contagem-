name: CI / Automated Quality & Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-audit-and-test:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Run Jest Test Suites
        working-directory: ./backend
        run: npm test -- --runInBand --coverage
        env:
          JWT_SECRET: ci_github_actions_test_jwt_secret_key_1234567890
          NODE_ENV: test
