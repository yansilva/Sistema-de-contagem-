name: CI / Automated Quality & Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-audit-and-test:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Run Jest Test Suites
        working-directory: ./backend
        run: npm test -- --runInBand --coverage
        env:
          JWT_SECRET: ci_github_actions_test_jwt_secret_key_1234567890
          NODE_ENV: test
